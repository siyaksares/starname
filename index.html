<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starname</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink:   #0e0e0e; --ink2: #5a5a5a; --ink3: #a0a0a0;
    --paper: #f5f3ef; --rule: #d8d4cc; --green: #1a6b3c; --red: #8b1a1a;
    --mono: 'DM Mono', monospace; --serif: 'Instrument Serif', serif;
  }
  html, body { height: 100%; background: var(--paper); color: var(--ink); }
  body { font-family: var(--mono); font-size: 13px; line-height: 1.6; display: flex; justify-content: center; padding: 48px 16px 80px; min-height: 100vh; }
  #root { width: 100%; max-width: 480px; }

  .wordmark { font-family: var(--serif); font-size: 42px; line-height: 1; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 4px; }
  .wordmark em { font-style: italic; }
  .tagline { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); margin-bottom: 48px; }
  hr { border: none; border-top: 1px solid var(--rule); margin: 28px 0; }
  .label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3); margin-bottom: 10px; }

  .input-row { display: flex; align-items: stretch; border: 1px solid var(--ink); background: #fff; }
  .input-row input { flex: 1; padding: 12px 14px; font-family: var(--mono); font-size: 15px; border: none; outline: none; background: transparent; color: var(--ink); min-width: 0; }
  .input-row input::placeholder { color: var(--ink3); }
  .suffix { padding: 12px 12px 12px 0; font-size: 15px; color: var(--ink3); user-select: none; align-self: center; }
  .input-row button { padding: 0 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--ink); color: var(--paper); border: none; cursor: pointer; transition: opacity 0.15s; }
  .input-row button:disabled { opacity: 0.35; cursor: default; }
  .input-row button:not(:disabled):hover { opacity: 0.75; }

  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 6px 12px; margin-top: 10px; border: 1px solid var(--rule); }
  .pill.ok  { border-color: var(--green); color: var(--green); }
  .pill.err { border-color: var(--red);   color: var(--red);   }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .btn { width: 100%; padding: 14px; margin-top: 14px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--ink); color: var(--paper); border: none; cursor: pointer; transition: opacity 0.15s; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:not(:disabled):hover { opacity: 0.78; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.ghost:not(:disabled):hover { background: var(--ink); color: var(--paper); }

  .data-row { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--rule); gap: 12px; }
  .data-row:last-child { border-bottom: none; }
  .data-key  { color: var(--ink3); font-size: 11px; letter-spacing: 0.06em; flex-shrink: 0; }
  .data-value { color: var(--ink); font-size: 13px; word-break: break-all; text-align: right; }
  .data-value.name { font-family: var(--serif); font-size: 18px; font-style: italic; }
  .data-value.mono { font-size: 11px; }

  a.tx-link { color: var(--ink3); font-size: 10px; letter-spacing: 0.08em; text-decoration: underline; text-underline-offset: 3px; }
  a.tx-link:hover { color: var(--ink); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--ink3); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }

  @keyframes slidein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .slide { animation: slidein 0.25s ease both; }

  .resolve-input-row { display: flex; border: 1px solid var(--ink); }
  .resolve-input-row input { flex: 1; padding: 10px 12px; font-family: var(--mono); font-size: 13px; border: none; outline: none; background: #fff; color: var(--ink); min-width: 0; }
  .resolve-input-row input::placeholder { color: var(--ink3); }
  .resolve-input-row button { padding: 0 16px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--ink); color: var(--paper); border: none; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
  .resolve-input-row button:disabled { opacity: 0.35; cursor: default; }
  .resolve-input-row button:not(:disabled):hover { opacity: 0.75; }

  .wallet-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 1px solid var(--rule); background: #fff; margin-bottom: 28px; }
  .wallet-status { display: flex; align-items: center; gap: 8px; }
  .wallet-dot { width: 7px; height: 7px; border-radius: 50%; }
  .wallet-dot.on  { background: var(--green); }
  .wallet-dot.off { background: var(--ink3); }
  .wallet-addr { font-size: 12px; color: var(--ink2); }
  .wallet-btn { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid var(--rule); padding: 5px 10px; cursor: pointer; color: var(--ink2); transition: all 0.15s; }
  .wallet-btn:hover { border-color: var(--ink); color: var(--ink); }
  .wallet-btn.connect { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .wallet-btn.connect:hover { opacity: 0.8; }

  .success-banner { border: 1px solid var(--green); padding: 18px; margin-top: 14px; }
  .success-name { font-family: var(--serif); font-size: 28px; font-style: italic; color: var(--green); line-height: 1.1; margin-bottom: 8px; }
  .success-sub { font-size: 11px; color: var(--green); opacity: 0.8; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(14,14,14,0.5); display: flex; align-items: center; justify-content: center; z-index: 999; animation: fadein 0.15s ease both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: var(--paper); border: 1px solid var(--ink); width: 100%; max-width: 340px; margin: 16px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
  .modal-title { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3); }
  .modal-close { background: none; border: none; font-size: 20px; line-height: 1; color: var(--ink3); cursor: pointer; padding: 0 4px; }
  .modal-close:hover { color: var(--ink); }
  .modal-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

  .wallet-option { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 14px; border: 1px solid var(--rule); background: #fff; cursor: pointer; text-align: left; font-family: var(--mono); transition: border-color 0.12s; }
  .wallet-option:hover:not(:disabled) { border-color: var(--ink); }
  .wallet-option:disabled { opacity: 0.38; cursor: default; }
  .wo-icon { width: 32px; height: 32px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; background: var(--paper); border: 1px solid var(--rule); }
  .wo-name { font-size: 13px; color: var(--ink); }
  .wo-sub  { font-size: 10px; color: var(--ink3); margin-top: 1px; letter-spacing: 0.03em; }
  .modal-sep { height: 1px; background: var(--rule); margin: 4px 0; }
  .modal-error { padding: 8px 14px 14px; font-size: 11px; color: var(--red); text-align: center; }

  /* file:// warning banner */
  .file-warning { background: #fff8e1; border: 1px solid #f0c040; padding: 10px 14px; margin-bottom: 16px; font-size: 11px; color: #7a5800; line-height: 1.5; }
  .file-warning strong { display: block; margin-bottom: 3px; font-size: 12px; }
  .file-warning code { background: #f5e9b8; padding: 1px 5px; font-family: var(--mono); font-size: 10px; }
</style>
</head>

<div id="root"></div>

<!--
  SCRIPT 1 — classic (non-module) script.
  Runs synchronously before any module code.
  Exposes __scanWallets() on window so the React app can call it.
  Classic scripts work under file:// and are not deferred by the module loader.
-->
<script>
(function () {
  /*
    labelProvider(p) — return { name, icon } for any EIP-1193 provider.
    Order matters: Rabby sets isMetaMask = true for dApp compat, so
    check isRabby FIRST, otherwise Rabby shows up as "MetaMask".
  */
  function labelProvider(p) {
    if (!p || typeof p.request !== 'function') return null;
    if (p.isRabby)                                 return { name: 'Rabby',           icon: '🐇' };
    if (p.isCoinbaseWallet || p.isCoinbaseBrowser) return { name: 'Coinbase Wallet', icon: '🔵' };
    if (p.isPhantom && p.isEVM !== false)          return { name: 'Phantom',         icon: '👻' };
    if (p.isBraveWallet)                           return { name: 'Brave Wallet',    icon: '🦁' };
    if (p.isMetaMask)                              return { name: 'MetaMask',        icon: '🦊' };
    return { name: 'Browser wallet', icon: '🔑' };
  }

  /*
    __scanWallets() — collect every distinct EIP-1193 provider the page
    currently exposes. Two passes:

    Pass 1: window.ethereum.providers[]
      When MetaMask AND Rabby are both installed, the last one to inject
      owns window.ethereum, but both register in window.ethereum.providers[].
      This is the canonical multi-wallet discovery surface.

    Pass 2: window.ethereum itself
      When only one wallet is installed it never populates providers[].
      We always also try the top-level object, and deduplicate via a Set.

    Result is a plain array of { name, icon, provider } objects that React
    state can hold safely (no Proxy issues).
  */
  window.__scanWallets = function () {
    var seen = new Set();
    var list = [];

    function add(p) {
      if (!p || seen.has(p)) return;
      var meta = labelProvider(p);
      if (!meta) return;
      seen.add(p);
      /* Store the provider reference on the item so React can call it later.
         We keep provider as a direct reference — do NOT JSON.stringify it. */
      list.push({ name: meta.name, icon: meta.icon, provider: p });
    }

    /* Pass 1 */
    var arr = window.ethereum && window.ethereum.providers;
    if (Array.isArray(arr)) arr.forEach(add);

    /* Pass 2 — always, regardless of pass 1 */
    if (window.ethereum) add(window.ethereum);

    return list;
  };

  /* Detect file:// protocol so the React app can show a warning */
  window.__isFileProtocol = (location.protocol === 'file:');
})();
</script>

<!-- SCRIPT 2 — React app as ES module -->
<script type="module">
import { createElement as h, useState, useEffect, useRef, useCallback } from 'https://esm.sh/react@18';
import { createRoot } from 'https://esm.sh/react-dom@18/client';
import { createPublicClient, createWalletClient, custom, http, parseAbi } from 'https://esm.sh/viem@2';

/* ── Contract ── */
const REGISTRY_ADDRESS = '0x2B6FdA740ed1C7d0AF077EDC573931B943E0e1AD';
const REGISTRY_ABI = parseAbi([
  'function isAvailable(string calldata name) external view returns (bool)',
  'function mint(string calldata name) external',
  'function resolve(string calldata name) external view returns (address)',
  'function reverseLookup(address owner) external view returns (string memory)',
]);
const SONEIUM_MINATO = {
  id: 1946,
  name: 'Soneium Minato Testnet',
  nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
  rpcUrls: { default: { http: ['https://rpc.minato.soneium.org'] } },
};
const CHAIN_HEX = '0x79A';
const EXPLORER  = 'https://soneium-minato.blockscout.com';
const NULL_ADDR = '0x0000000000000000000000000000000000000000';

/*
  Paste your free WalletConnect project ID here if you want mobile wallet
  support. Get one at cloud.walletconnect.com in ~30 seconds.
  Leave empty and the WC option is simply hidden.
*/
const WC_PROJECT_ID = '';

const publicClient = createPublicClient({ chain: SONEIUM_MINATO, transport: http() });

async function switchToMinato(provider) {
  try {
    await provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_HEX }] });
  } catch (err) {
    if (err.code === 4902 || err.code === -32603) {
      await provider.request({
        method: 'wallet_addEthereumChain',
        params: [{
          chainId: CHAIN_HEX,
          chainName: 'Soneium Minato Testnet',
          nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
          rpcUrls: ['https://rpc.minato.soneium.org'],
          blockExplorerUrls: [EXPLORER],
        }],
      });
    } else throw err;
  }
}

const short = a => a ? `${a.slice(0,6)}…${a.slice(-4)}` : '';

/* ── WalletModal ── */
function WalletModal({ wallets, onSelect, onClose, modalError, connecting }) {
  const wcEnabled = WC_PROJECT_ID.length > 0;
  return h('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
    h('div', { className: 'modal slide' },
      h('div', { className: 'modal-header' },
        h('span', { className: 'modal-title' }, 'Connect wallet'),
        h('button', { className: 'modal-close', onClick: onClose }, '×'),
      ),
      h('div', { className: 'modal-body' },

        wallets.length > 0
          ? wallets.map((w, i) =>
              h('button', { key: i, className: 'wallet-option', disabled: connecting, onClick: () => onSelect(w) },
                h('div', { className: 'wo-icon' }, w.icon),
                h('div', null,
                  h('div', { className: 'wo-name' }, w.name),
                  h('div', { className: 'wo-sub' }, 'Browser extension'),
                ),
              )
            )
          : h('div', { style: { padding: '8px 0' } },
              h('div', { className: 'wallet-option', style: { cursor: 'default', opacity: 0.5 } },
                h('div', { className: 'wo-icon' }, '🔌'),
                h('div', null,
                  h('div', { className: 'wo-name' }, 'No wallet detected'),
                  h('div', { className: 'wo-sub' }, 'Reload the page and try again'),
                ),
              ),
              window.__isFileProtocol && h('div', { className: 'file-warning', style: { marginTop: 8 } },
                h('strong', null, '⚠ Opened as a local file'),
                'Extensions cannot inject into ',
                h('code', null, 'file://'),
                ' pages. Serve this file over HTTP instead:',
                h('br'),
                h('code', null, 'npx serve .'),
                ' then open ',
                h('code', null, 'http://localhost:3000'),
              ),
            ),

        wcEnabled && h('div', { style: { display: 'contents' } },
          h('div', { className: 'modal-sep' }),
          h('button', { className: 'wallet-option', disabled: connecting, onClick: () => onSelect(null, 'walletconnect') },
            h('div', { className: 'wo-icon', style: { background: '#e8f2ff', borderColor: '#c0d8f8' } },
              h('svg', { width: 18, height: 18, viewBox: '0 0 32 32', fill: 'none' },
                h('path', { fill: '#3b99fc', d: 'M9.6 12.8c3.5-3.5 9.2-3.5 12.8 0l.43.42c.17.18.17.46 0 .64l-1.47 1.43c-.09.09-.23.09-.32 0l-.59-.58c-2.44-2.4-6.4-2.4-8.84 0l-.63.62c-.09.09-.23.09-.32 0L9.17 13.9c-.18-.18-.18-.46 0-.64l.43-.46zm15.8 2.95 1.31 1.28c.18.17.18.46 0 .63l-5.9 5.77c-.18.17-.46.17-.64 0l-4.18-4.1c-.05-.04-.12-.04-.16 0l-4.18 4.1c-.18.17-.47.17-.65 0L5.1 17.66c-.18-.17-.18-.46 0-.63l1.31-1.28c.18-.17.47-.17.65 0l4.18 4.1c.04.05.11.05.16 0l4.18-4.1c.18-.17.46-.17.64 0l4.18 4.1c.05.05.12.05.16 0l4.18-4.1c.18-.17.47-.17.65 0z' }),
              )
            ),
            h('div', null,
              h('div', { className: 'wo-name' }, 'WalletConnect'),
              h('div', { className: 'wo-sub' }, 'Scan QR · any mobile wallet'),
            ),
          ),
        ),
      ),
      modalError && h('div', { className: 'modal-error' }, modalError),
    )
  );
}

/* ── App ── */
function App() {
  const [address,    setAddress]    = useState(null);
  const [walletName, setWalletName] = useState('');
  const [wallets,    setWallets]    = useState([]);
  const [showModal,  setShowModal]  = useState(false);
  const [connecting, setConnecting] = useState(false);
  const [modalError, setModalError] = useState(null);
  const providerRef = useRef(null);
  const wcRef       = useRef(null);

  const [nameInput,  setNameInput]  = useState('');
  const [available,  setAvailable]  = useState(null);
  const [checking,   setChecking]   = useState(false);
  const [minting,    setMinting]    = useState(false);
  const [mintedName, setMintedName] = useState(null);
  const [mintTx,     setMintTx]     = useState(null);
  const [mintError,  setMintError]  = useState(null);
  const [ownedName,  setOwnedName]  = useState(null);

  const [resolveInput, setResolveInput] = useState('');
  const [resolved,     setResolved]     = useState(null);
  const [resolving,    setResolving]    = useState(false);
  const [resolveError, setResolveError] = useState(null);

  const loadOwnedName = useCallback(async (addr) => {
    try {
      const name = await publicClient.readContract({
        address: REGISTRY_ADDRESS, abi: REGISTRY_ABI,
        functionName: 'reverseLookup', args: [addr],
      });
      setOwnedName(name || null);
    } catch { setOwnedName(null); }
  }, []);

  const doDisconnect = useCallback(() => {
    setAddress(null); setOwnedName(null); setWalletName('');
    providerRef.current = null;
  }, []);

  /*
    Detection strategy
    ──────────────────
    We call window.__scanWallets() (defined in the classic script above)
    on three separate triggers to handle all timing scenarios:

    T=0ms   — immediate call on mount. Fast: catches wallets that inject
              synchronously (some do, especially in production builds).

    T=500ms — delayed call. Handles wallets that inject asynchronously
              after DOMContentLoaded (most extensions do this).

    EIP-6963 announce event — modern wallets dispatch
              'eip6963:announceProvider' when they're ready. We listen for
              this and re-scan when it fires, which is the most reliable
              signal that a new provider is available.
  */
  useEffect(() => {
    let alive = true;

    function refresh() {
      if (!alive) return;
      const found = window.__scanWallets();
      setWallets(found);

      /* Silent reconnect: restore session if user was already connected */
      found.forEach(w => {
        w.provider.request({ method: 'eth_accounts' })
          .then(accs => {
            if (accs && accs[0] && !providerRef.current && alive) {
              providerRef.current = w.provider;
              setWalletName(w.name);
              setAddress(accs[0]);
              loadOwnedName(accs[0]);
            }
          })
          .catch(() => {});

        /* Account change listener */
        w.provider.on && w.provider.on('accountsChanged', function (accs) {
          if (providerRef.current !== w.provider) return;
          if (accs && accs[0]) { setAddress(accs[0]); loadOwnedName(accs[0]); }
          else doDisconnect();
        });
      });
    }

    /* T=0 */
    refresh();

    /* T=500ms fallback */
    const t1 = setTimeout(refresh, 500);

    /* EIP-6963 — fires when a wallet announces itself */
    window.addEventListener('eip6963:announceProvider', refresh);

    /* Trigger wallets that support EIP-6963 to announce themselves */
    window.dispatchEvent(new Event('eip6963:requestProvider'));

    return () => {
      alive = false;
      clearTimeout(t1);
      window.removeEventListener('eip6963:announceProvider', refresh);
    };
  }, [loadOwnedName, doDisconnect]);

  /* Wallet selection */
  const handleSelect = async (walletInfo, type) => {
    setModalError(null);
    setConnecting(true);
    try {
      if (type === 'walletconnect') {
        const { default: EthereumProvider } = await import('https://esm.sh/@walletconnect/ethereum-provider@2');
        let wcp = wcRef.current;
        if (!wcp) {
          wcp = await EthereumProvider.init({
            projectId: WC_PROJECT_ID, chains: [1946], optionalChains: [1946],
            rpcMap: { 1946: 'https://rpc.minato.soneium.org' },
            showQrModal: true,
            metadata: { name: 'Starname', description: 'Onchain identity on Soneium', url: location.origin, icons: [] },
          });
          wcRef.current = wcp;
          wcp.on('accountsChanged', accs => {
            if (!accs || !accs[0]) { doDisconnect(); return; }
            providerRef.current = wcp;
            setAddress(accs[0]); loadOwnedName(accs[0]);
          });
          wcp.on('disconnect', doDisconnect);
        }
        await wcp.connect();
        const accs = await wcp.request({ method: 'eth_accounts' });
        providerRef.current = wcp;
        setWalletName('WalletConnect');
        setAddress(accs[0]);
        await loadOwnedName(accs[0]);

      } else {
        const p = walletInfo.provider;
        await switchToMinato(p);
        const accs = await p.request({ method: 'eth_requestAccounts' });
        providerRef.current = p;
        setWalletName(walletInfo.name);
        setAddress(accs[0]);
        await loadOwnedName(accs[0]);
      }
      setShowModal(false);
    } catch (e) {
      const raw = e?.message || String(e);
      setModalError(raw.length > 100 ? raw.slice(0, 100) + '…' : raw);
    }
    setConnecting(false);
  };

  const disconnect = async () => {
    if (wcRef.current && providerRef.current === wcRef.current) {
      try { await wcRef.current.disconnect(); } catch {}
      wcRef.current = null;
    }
    doDisconnect();
  };

  const openModal = () => { setModalError(null); setShowModal(true); };

  const handleNameInput = val => {
    setNameInput(val.toLowerCase().replace(/[^a-z0-9-]/g, ''));
    setAvailable(null); setMintError(null);
  };

  const checkAvailability = async () => {
    if (nameInput.length < 3) return;
    setChecking(true); setAvailable(null); setMintError(null);
    try {
      const ok = await publicClient.readContract({
        address: REGISTRY_ADDRESS, abi: REGISTRY_ABI,
        functionName: 'isAvailable', args: [nameInput],
      });
      setAvailable(ok);
    } catch { setMintError('Could not check — RPC error.'); }
    setChecking(false);
  };

  const mintName = async () => {
    if (!address || !providerRef.current) return;
    setMinting(true); setMintError(null);
    try {
      if (providerRef.current !== wcRef.current) await switchToMinato(providerRef.current);
      const wc = createWalletClient({ chain: SONEIUM_MINATO, transport: custom(providerRef.current) });
      const hash = await wc.writeContract({
        address: REGISTRY_ADDRESS, abi: REGISTRY_ABI,
        functionName: 'mint', args: [nameInput], account: address,
      });
      setMintTx(hash);
      await publicClient.waitForTransactionReceipt({ hash });
      setMintedName(nameInput); setOwnedName(nameInput); setAvailable(null);
    } catch (e) {
      const msg = e?.shortMessage || e?.message || 'Transaction failed';
      setMintError(msg.length > 120 ? msg.slice(0, 120) + '…' : msg);
    }
    setMinting(false);
  };

  const resolveName = async () => {
    const name = resolveInput.trim().toLowerCase().replace(/\.star$/, '');
    if (!name) return;
    setResolving(true); setResolved(null); setResolveError(null);
    try {
      const addr = await publicClient.readContract({
        address: REGISTRY_ADDRESS, abi: REGISTRY_ABI,
        functionName: 'resolve', args: [name],
      });
      if (!addr || addr === NULL_ADDR) setResolveError(`${name}.star is not registered.`);
      else setResolved({ name, address: addr });
    } catch { setResolveError('Resolve failed — RPC error.'); }
    setResolving(false);
  };

  return h('div', null,

    showModal && h(WalletModal, { wallets, onSelect: handleSelect, onClose: () => setShowModal(false), modalError, connecting }),

    h('p', { className: 'wordmark' }, 'Star', h('em', null, 'name')),
    h('p', { className: 'tagline' }, 'Onchain identity · Soneium'),

    /* file:// top-level warning (shown outside modal too) */
    window.__isFileProtocol && !address && h('div', { className: 'file-warning' },
      h('strong', null, '⚠ Opened as a local file (file://)'),
      'Browser extensions cannot inject into local files. ',
      'Serve this file with a local HTTP server instead:',
      h('br'),
      h('code', null, 'npx serve .'),
      '  →  then open  ',
      h('code', null, 'http://localhost:3000/starname.html'),
    ),

    h('div', { className: 'wallet-bar' },
      h('div', { className: 'wallet-status' },
        h('div', { className: `wallet-dot ${address ? 'on' : 'off'}` }),
        h('span', { className: 'wallet-addr' },
          address ? `${walletName ? walletName + ' · ' : ''}${short(address)}` : 'No wallet connected'
        ),
      ),
      address
        ? h('button', { className: 'wallet-btn', onClick: disconnect }, 'Disconnect')
        : h('button', { className: 'wallet-btn connect', onClick: openModal }, 'Connect wallet')
    ),

    h('p', { className: 'label' }, 'Claim a name'),
    h('div', { className: 'input-row' },
      h('input', { value: nameInput, onChange: e => handleNameInput(e.target.value), onKeyDown: e => e.key === 'Enter' && checkAvailability(), placeholder: 'yourname', maxLength: 32, spellCheck: false }),
      h('span', { className: 'suffix' }, '.star'),
      h('button', { onClick: checkAvailability, disabled: nameInput.length < 3 || checking }, checking ? '…' : 'Check'),
    ),

    available === true && !mintedName && h('div', { className: 'pill ok slide' }, h('span', { className: 'dot' }), `${nameInput}.star is available`),
    available === false && h('div', { className: 'pill err slide' }, h('span', { className: 'dot' }), `${nameInput}.star is taken`),

    available === true && !mintedName && (
      !address
        ? h('button', { className: 'btn ghost', onClick: openModal }, 'Connect wallet to mint')
        : h('button', { className: 'btn', onClick: mintName, disabled: minting },
            minting ? h('span', null, h('span', { className: 'spinner' }), 'Minting…') : `Mint ${nameInput}.star`
          )
    ),

    mintError && h('div', { className: 'pill err slide', style: { marginTop: 10 } }, h('span', { className: 'dot' }), mintError),

    mintedName && h('div', { className: 'success-banner slide' },
      h('div', { className: 'success-name' }, `${mintedName}.star`),
      h('div', { className: 'success-sub' }, `Owned by ${short(address)}`),
      mintTx && h('div', { style: { marginTop: 10 } },
        h('a', { className: 'tx-link', href: `${EXPLORER}/tx/${mintTx}`, target: '_blank', rel: 'noreferrer' }, 'View tx ↗')
      )
    ),

    h('hr'),

    ownedName && h('div', { className: 'slide' },
      h('p', { className: 'label' }, 'Your name'),
      h('div', { className: 'data-row' }, h('span', { className: 'data-key' }, 'Name'), h('span', { className: 'data-value name' }, `${ownedName}.star`)),
      h('div', { className: 'data-row' }, h('span', { className: 'data-key' }, 'Owner'), h('span', { className: 'data-value mono' }, address)),
      h('div', { className: 'data-row' }, h('span', { className: 'data-key' }, 'Explorer'),
        h('a', { className: 'tx-link', href: `${EXPLORER}/address/${address}`, target: '_blank', rel: 'noreferrer' }, 'View on Blockscout ↗'),
      ),
      h('hr'),
    ),

    h('p', { className: 'label' }, 'Resolve a name'),
    h('div', { className: 'resolve-input-row' },
      h('input', { value: resolveInput, onChange: e => { setResolveInput(e.target.value); setResolved(null); setResolveError(null); }, onKeyDown: e => e.key === 'Enter' && resolveName(), placeholder: 'emre.star or emre', spellCheck: false }),
      h('button', { onClick: resolveName, disabled: !resolveInput.trim() || resolving }, resolving ? '…' : 'Resolve'),
    ),

    resolveError && h('div', { className: 'pill err slide', style: { marginTop: 10 } }, h('span', { className: 'dot' }), resolveError),

    resolved && h('div', { className: 'slide', style: { marginTop: 10 } },
      h('div', { className: 'data-row' }, h('span', { className: 'data-key' }, 'Name'), h('span', { className: 'data-value name' }, `${resolved.name}.star`)),
      h('div', { className: 'data-row' }, h('span', { className: 'data-key' }, 'Address'), h('span', { className: 'data-value mono' }, resolved.address)),
      h('div', { className: 'data-row' }, h('span', { className: 'data-key' }, 'Explorer'),
        h('a', { className: 'tx-link', href: `${EXPLORER}/address/${resolved.address}`, target: '_blank', rel: 'noreferrer' }, 'View on Blockscout ↗'),
      ),
    ),

    h('div', { style: { marginTop: 60, color: 'var(--ink3)', fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase' } },
      'Contract · ',
      h('a', { href: `${EXPLORER}/address/${REGISTRY_ADDRESS}`, target: '_blank', rel: 'noreferrer', style: { color: 'var(--ink3)', textDecoration: 'underline', textUnderlineOffset: '3px' } }, `${REGISTRY_ADDRESS.slice(0, 10)}…`),
    ),
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
