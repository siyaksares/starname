<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starname</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:    #0e0e0e;
    --ink2:   #5a5a5a;
    --ink3:   #a0a0a0;
    --paper:  #f5f3ef;
    --rule:   #d8d4cc;
    --accent: #0e0e0e;
    --green:  #1a6b3c;
    --red:    #8b1a1a;
    --mono:   'DM Mono', monospace;
    --serif:  'Instrument Serif', serif;
  }

  html, body { height: 100%; background: var(--paper); color: var(--ink); }

  body {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    display: flex;
    justify-content: center;
    padding: 48px 16px 80px;
    min-height: 100vh;
  }

  #root { width: 100%; max-width: 480px; }

  /* ── Typography ── */
  .wordmark {
    font-family: var(--serif);
    font-size: 42px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .wordmark em { font-style: italic; }
  .tagline {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 48px;
  }

  /* ── Divider ── */
  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 28px 0;
  }

  /* ── Section label ── */
  .label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 10px;
  }

  /* ── Input row ── */
  .input-row {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--ink);
    background: #fff;
  }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 15px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    min-width: 0;
  }
  .input-row input::placeholder { color: var(--ink3); }
  .suffix {
    padding: 12px 12px 12px 0;
    font-size: 15px;
    color: var(--ink3);
    user-select: none;
    align-self: center;
  }
  .input-row button {
    padding: 0 18px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .input-row button:disabled { opacity: 0.35; cursor: default; }
  .input-row button:not(:disabled):hover { opacity: 0.75; }

  /* ── Status pill ── */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    padding: 6px 12px;
    margin-top: 10px;
    border: 1px solid var(--rule);
  }
  .pill.ok   { border-color: var(--green); color: var(--green); }
  .pill.err  { border-color: var(--red);   color: var(--red);   }
  .pill.info { border-color: var(--ink2);  color: var(--ink2);  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  /* ── Primary button ── */
  .btn {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:not(:disabled):hover { opacity: 0.78; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .btn.ghost:not(:disabled):hover { background: var(--ink); color: var(--paper); }

  /* ── Data rows ── */
  .data-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
    gap: 12px;
  }
  .data-row:last-child { border-bottom: none; }
  .data-key   { color: var(--ink3); font-size: 11px; letter-spacing: 0.06em; flex-shrink: 0; }
  .data-value { color: var(--ink);  font-size: 13px; word-break: break-all; text-align: right; }
  .data-value.name { font-family: var(--serif); font-size: 18px; font-style: italic; }
  .data-value.mono { font-size: 11px; }

  /* ── Tx link ── */
  a.tx-link {
    color: var(--ink3);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  a.tx-link:hover { color: var(--ink); }

  /* ── Spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 11px; height: 11px;
    border: 1.5px solid var(--ink3);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  /* ── Slide-in ── */
  @keyframes slidein {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .slide { animation: slidein 0.25s ease both; }

  /* ── Resolve lookup ── */
  .resolve-input-row {
    display: flex;
    gap: 0;
    border: 1px solid var(--ink);
  }
  .resolve-input-row input {
    flex: 1;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 13px;
    border: none;
    outline: none;
    background: #fff;
    color: var(--ink);
    min-width: 0;
  }
  .resolve-input-row input::placeholder { color: var(--ink3); }
  .resolve-input-row button {
    padding: 0 16px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .resolve-input-row button:disabled { opacity: 0.35; cursor: default; }
  .resolve-input-row button:not(:disabled):hover { opacity: 0.75; }

  /* ── Wallet bar ── */
  .wallet-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border: 1px solid var(--rule);
    background: #fff;
    margin-bottom: 28px;
  }
  .wallet-status { display: flex; align-items: center; gap: 8px; }
  .wallet-dot    { width: 7px; height: 7px; border-radius: 50%; }
  .wallet-dot.on  { background: var(--green); }
  .wallet-dot.off { background: var(--ink3); }
  .wallet-addr   { font-size: 12px; color: var(--ink2); }
  .wallet-btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--rule);
    padding: 5px 10px;
    cursor: pointer;
    color: var(--ink2);
    transition: all 0.15s;
  }
  .wallet-btn:hover { border-color: var(--ink); color: var(--ink); }
  .wallet-btn.connect {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .wallet-btn.connect:hover { opacity: 0.8; }

  /* ── Success banner ── */
  .success-banner {
    border: 1px solid var(--green);
    padding: 18px;
    margin-top: 14px;
  }
  .success-name {
    font-family: var(--serif);
    font-size: 28px;
    font-style: italic;
    color: var(--green);
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .success-sub { font-size: 11px; color: var(--green); opacity: 0.8; }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { createElement as h, useState, useEffect, useCallback } from 'https://esm.sh/react@18';
import { createRoot } from 'https://esm.sh/react-dom@18/client';
import { createPublicClient, createWalletClient, custom, http, parseAbi } from 'https://esm.sh/viem@2';

/* ─── Contract config ─── */
const REGISTRY_ADDRESS = '0x2B6FdA740ed1C7d0AF077EDC573931B943E0e1AD';

const REGISTRY_ABI = parseAbi([
  'function isAvailable(string calldata name) external view returns (bool)',
  'function mint(string calldata name) external',
  'function resolve(string calldata name) external view returns (address)',
  'function reverseLookup(address owner) external view returns (string memory)',
]);

const SONEIUM_MINATO = {
  id: 1946,
  name: 'Soneium Minato Testnet',
  nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
  rpcUrls: { default: { http: ['https://rpc.minato.soneium.org'] } },
};

const publicClient = createPublicClient({
  chain: SONEIUM_MINATO,
  transport: http(),
});

const NULL_ADDR = '0x0000000000000000000000000000000000000000';
const EXPLORER  = 'https://soneium-minato.blockscout.com';

/* ─── Wallet helpers ─── */
async function getProvider() {
  if (typeof window.ethereum === 'undefined') {
    throw new Error('No wallet detected. Install MetaMask.');
  }
  return window.ethereum;
}

async function switchToMinato(provider) {
  try {
    await provider.request({
      method: 'wallet_switchEthereumChain',
      params: [{ chainId: '0x79A' }], // 1946 hex
    });
  } catch (err) {
    if (err.code === 4902) {
      await provider.request({
        method: 'wallet_addEthereumChain',
        params: [{
          chainId: '0x79A',
          chainName: 'Soneium Minato Testnet',
          nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
          rpcUrls: ['https://rpc.minato.soneium.org'],
          blockExplorerUrls: [EXPLORER],
        }],
      });
    } else throw err;
  }
}

/* ─── App ─── */
function App() {
  /* wallet state */
  const [address, setAddress]   = useState(null);
  const [connecting, setConn]   = useState(false);

  /* search & mint state */
  const [nameInput, setNameInput] = useState('');
  const [available, setAvailable] = useState(null); // null | true | false
  const [checking, setChecking]   = useState(false);
  const [minting, setMinting]     = useState(false);
  const [mintedName, setMintedName] = useState(null);
  const [mintTx, setMintTx]       = useState(null);
  const [mintError, setMintError] = useState(null);

  /* owned name */
  const [ownedName, setOwnedName] = useState(null);

  /* resolve */
  const [resolveInput, setResolveInput] = useState('');
  const [resolved, setResolved]         = useState(null); // { name, address } | null
  const [resolving, setResolving]       = useState(false);
  const [resolveError, setResolveError] = useState(null);

  /* ── on mount: check if already connected ── */
  useEffect(() => {
    if (window.ethereum) {
      window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
        if (accounts[0]) handleConnected(accounts[0]);
      });
      window.ethereum.on('accountsChanged', accs => {
        if (accs[0]) handleConnected(accs[0]);
        else { setAddress(null); setOwnedName(null); }
      });
    }
  }, []);

  const handleConnected = async (addr) => {
    setAddress(addr);
    try {
      const name = await publicClient.readContract({
        address: REGISTRY_ADDRESS,
        abi: REGISTRY_ABI,
        functionName: 'reverseLookup',
        args: [addr],
      });
      setOwnedName(name || null);
    } catch { setOwnedName(null); }
  };

  /* ── connect wallet ── */
  const connectWallet = async () => {
    setConn(true);
    try {
      const provider = await getProvider();
      await switchToMinato(provider);
      const accounts = await provider.request({ method: 'eth_requestAccounts' });
      await handleConnected(accounts[0]);
    } catch (e) {
      alert(e.message);
    }
    setConn(false);
  };

  const disconnect = () => { setAddress(null); setOwnedName(null); };

  /* ── sanitise input ── */
  const handleNameInput = (val) => {
    const clean = val.toLowerCase().replace(/[^a-z0-9-]/g, '');
    setNameInput(clean);
    setAvailable(null);
    setMintError(null);
  };

  /* ── check availability ── */
  const checkAvailability = async () => {
    if (nameInput.length < 3) return;
    setChecking(true);
    setAvailable(null);
    setMintError(null);
    try {
      const ok = await publicClient.readContract({
        address: REGISTRY_ADDRESS,
        abi: REGISTRY_ABI,
        functionName: 'isAvailable',
        args: [nameInput],
      });
      setAvailable(ok);
    } catch (e) {
      setMintError('Could not check — RPC error.');
    }
    setChecking(false);
  };

  /* ── mint ── */
  const mintName = async () => {
    if (!address) return;
    setMinting(true);
    setMintError(null);
    try {
      const provider = await getProvider();
      await switchToMinato(provider);
      const walletClient = createWalletClient({
        chain: SONEIUM_MINATO,
        transport: custom(provider),
      });
      const hash = await walletClient.writeContract({
        address: REGISTRY_ADDRESS,
        abi: REGISTRY_ABI,
        functionName: 'mint',
        args: [nameInput],
        account: address,
      });
      setMintTx(hash);
      await publicClient.waitForTransactionReceipt({ hash });
      setMintedName(nameInput);
      setOwnedName(nameInput);
      setAvailable(null);
    } catch (e) {
      const msg = e?.shortMessage || e?.message || 'Transaction failed';
      setMintError(msg.length > 120 ? msg.slice(0, 120) + '…' : msg);
    }
    setMinting(false);
  };

  /* ── resolve ── */
  const resolveName = async () => {
    const name = resolveInput.trim().toLowerCase().replace(/\.star$/, '');
    if (!name) return;
    setResolving(true);
    setResolved(null);
    setResolveError(null);
    try {
      const addr = await publicClient.readContract({
        address: REGISTRY_ADDRESS,
        abi: REGISTRY_ABI,
        functionName: 'resolve',
        args: [name],
      });
      if (!addr || addr === NULL_ADDR) {
        setResolveError(`${name}.star is not registered.`);
      } else {
        setResolved({ name, address: addr });
      }
    } catch {
      setResolveError('Resolve failed — RPC error.');
    }
    setResolving(false);
  };

  const short = (addr) => addr ? `${addr.slice(0,6)}…${addr.slice(-4)}` : '';

  /* ── render ── */
  return h('div', null,

    /* wordmark */
    h('p', { className: 'wordmark' }, 'Star', h('em', null, 'name')),
    h('p', { className: 'tagline' }, 'Onchain identity · Soneium'),

    /* wallet bar */
    h('div', { className: 'wallet-bar' },
      h('div', { className: 'wallet-status' },
        h('div', { className: `wallet-dot ${address ? 'on' : 'off'}` }),
        h('span', { className: 'wallet-addr' },
          address ? short(address) : 'No wallet connected'
        ),
      ),
      address
        ? h('button', { className: 'wallet-btn', onClick: disconnect }, 'Disconnect')
        : h('button', { className: 'wallet-btn connect', onClick: connectWallet, disabled: connecting },
            connecting ? 'Connecting…' : 'Connect wallet'
          )
    ),

    /* ── SECTION: mint ── */
    h('p', { className: 'label' }, 'Claim a name'),

    h('div', { className: 'input-row' },
      h('input', {
        value: nameInput,
        onChange: e => handleNameInput(e.target.value),
        onKeyDown: e => e.key === 'Enter' && checkAvailability(),
        placeholder: 'yourname',
        maxLength: 32,
        spellCheck: false,
      }),
      h('span', { className: 'suffix' }, '.star'),
      h('button', {
        onClick: checkAvailability,
        disabled: nameInput.length < 3 || checking,
      }, checking ? '…' : 'Check'),
    ),

    /* availability pill */
    available === true && !mintedName &&
      h('div', { className: 'pill ok slide' },
        h('span', { className: 'dot' }),
        `${nameInput}.star is available`
      ),
    available === false &&
      h('div', { className: 'pill err slide' },
        h('span', { className: 'dot' }),
        `${nameInput}.star is taken`
      ),

    /* mint button */
    available === true && !mintedName && (
      !address
        ? h('button', { className: 'btn ghost', onClick: connectWallet }, 'Connect wallet to mint')
        : h('button', {
            className: 'btn',
            onClick: mintName,
            disabled: minting,
          },
          minting
            ? h('span', null, h('span', { className: 'spinner' }), 'Minting…')
            : `Mint ${nameInput}.star`
          )
    ),

    /* mint error */
    mintError && h('div', { className: 'pill err slide', style: { marginTop: 10 } },
      h('span', { className: 'dot' }), mintError
    ),

    /* success */
    mintedName && h('div', { className: 'success-banner slide' },
      h('div', { className: 'success-name' }, `${mintedName}.star`),
      h('div', { className: 'success-sub' }, `Owned by ${short(address)}`),
      mintTx && h('div', { style: { marginTop: 10 } },
        h('a', {
          className: 'tx-link',
          href: `${EXPLORER}/tx/${mintTx}`,
          target: '_blank',
          rel: 'noreferrer',
        }, `View tx ↗`)
      )
    ),

    h('hr'),

    /* ── SECTION: your name ── */
    ownedName && h('div', { className: 'slide' },
      h('p', { className: 'label' }, 'Your name'),
      h('div', { className: 'data-row' },
        h('span', { className: 'data-key' }, 'Name'),
        h('span', { className: 'data-value name' }, `${ownedName}.star`),
      ),
      h('div', { className: 'data-row' },
        h('span', { className: 'data-key' }, 'Owner'),
        h('span', { className: 'data-value mono' }, address),
      ),
      h('div', { className: 'data-row' },
        h('span', { className: 'data-key' }, 'Explorer'),
        h('a', {
          className: 'tx-link',
          href: `${EXPLORER}/address/${address}`,
          target: '_blank',
          rel: 'noreferrer',
        }, 'View on Blockscout ↗'),
      ),
      h('hr'),
    ),

    /* ── SECTION: resolve ── */
    h('p', { className: 'label' }, 'Resolve a name'),

    h('div', { className: 'resolve-input-row' },
      h('input', {
        value: resolveInput,
        onChange: e => { setResolveInput(e.target.value); setResolved(null); setResolveError(null); },
        onKeyDown: e => e.key === 'Enter' && resolveName(),
        placeholder: 'emre.star or emre',
        spellCheck: false,
      }),
      h('button', { onClick: resolveName, disabled: !resolveInput.trim() || resolving },
        resolving ? '…' : 'Resolve'
      ),
    ),

    resolveError && h('div', { className: 'pill err slide', style: { marginTop: 10 } },
      h('span', { className: 'dot' }), resolveError
    ),

    resolved && h('div', { className: 'slide', style: { marginTop: 10 } },
      h('div', { className: 'data-row' },
        h('span', { className: 'data-key' }, 'Name'),
        h('span', { className: 'data-value name' }, `${resolved.name}.star`),
      ),
      h('div', { className: 'data-row' },
        h('span', { className: 'data-key' }, 'Address'),
        h('span', { className: 'data-value mono' }, resolved.address),
      ),
      h('div', { className: 'data-row' },
        h('span', { className: 'data-key' }, 'Explorer'),
        h('a', {
          className: 'tx-link',
          href: `${EXPLORER}/address/${resolved.address}`,
          target: '_blank',
          rel: 'noreferrer',
        }, 'View on Blockscout ↗'),
      ),
    ),

    /* footer */
    h('div', { style: { marginTop: 60, color: 'var(--ink3)', fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase' } },
      `Contract · `,
      h('a', {
        href: `${EXPLORER}/address/${REGISTRY_ADDRESS}`,
        target: '_blank',
        rel: 'noreferrer',
        style: { color: 'var(--ink3)', textDecoration: 'underline', textUnderlineOffset: '3px' },
      }, `${REGISTRY_ADDRESS.slice(0,10)}…`),
    ),
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
